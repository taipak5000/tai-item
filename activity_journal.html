    (function () {
      try {
        var saved = localStorage.getItem('sky_app_theme');
        var isDark = (saved === 'light' || saved === 'dark') ? (saved === 'dark') : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();

<script>
/* ==========================================================================
   🗓️ Sky Life活動日記
   同一オリジン（taipak5000.github.io）配下の姉妹ツールが、それぞれ自分の
   localStorageへ保存している「いつ・何をしたか」の記録を、直接読み出して
   1本のタイムラインへマージする。フェッチが必要なのはエモートの表示名解決
   （EMOTES_DATA、profiles.js内の横断検索と同じsrchExtractArray()を再利用）
   だけで、それ以外は全て同一オリジンのlocalStorageを直接読むだけで完結する。

   対象データ源（読み込み専用。書き込み・削除は一切行わない）：
     - エモート所持率管理: emoteAcquireLog_v1（emote/index.htmlのACQUIRE_LOG_KEY）
     - ノマキャン計算機　: skyNomacanCalc_history_v1（獲得履歴）
     - ノマキャン計算機　: dailyQuestLog_v1（デイリークエスト自由記述ログ）
     - 星のキャンドル計算機: skyStarCandleCalc_history_v1（獲得履歴）
     - 精霊同行ツール　　: sky_companion_v4_data(__<id>)のwalkLog（連れ歩き記録）
   いずれも現在アクティブなプロフィール（nsKey）のデータだけを対象にする
   （このサイト・姉妹サイト共通のプロフィール切り替えと挙動を揃えるため）。
   ========================================================================== */

// ── ノマキャン計算機の獲得履歴：labelKeyは表示のたびにtai-nomacan側のt()で
// 翻訳される文言なので、ここでは実際に使われている4種類だけを直接埋め込む
// （tai-nomacan/index.html 内の同名キーのja/enと同じ文言）
const JOURNAL_NOMACAN_LABELS = {
  'history.entryFillCurrent':  { ja: '所持通貨から反映',       en: 'Filled from owned currency' },
  'history.entrySurvey':       { ja: 'アンケート回答',         en: 'Survey answered' },
  'history.entryFinishToday':  { ja: '今日の分を集め終わった', en: "Finished today's collection" },
  'history.entryManualEdit':   { ja: '本数を直接入力',         en: 'Entered amount directly' },
};

function journalSafeParse(raw) {
  try { return JSON.parse(raw); } catch (e) { return null; }
}

// 'YYYY-MM-DD' 文字列を、時刻情報のないその日の0時としてDate化する
// （企業同行ツールのwalkLog・デイリークエストログのように日付単位でしか
// 記録されないデータの並び替え・グルーピング用）
function journalDateOnlyToTime(dateStr) {
  const d = new Date(String(dateStr) + 'T00:00:00');
  return isNaN(d.getTime()) ? null : d.getTime();
}

// ── データ源 1: エモート所持率管理の入手ログ ──
// emoteNameMapは journalBuildEmoteNameMap() が解決した { emoteId: {name, nameEn} }。
// 解決できなかった（未取得・フェッチ失敗）場合は素直にIDをそのまま表示する。
function journalReadEmoteLog(emoteNameMap) {
  const log = journalSafeParse(localStorage.getItem(nsKey('emoteAcquireLog_v1')));
  if (!log || typeof log !== 'object') return [];
  return Object.keys(log).map(key => {
    const rec = log[key];
    if (!rec || !rec.at || !rec.emoteId) return null;
    const t = new Date(rec.at).getTime();
    if (isNaN(t)) return null;
    const info = emoteNameMap[rec.emoteId];
    const nameJa = info ? info.name : rec.emoteId;
    const nameEn = info ? (info.nameEn || info.name) : rec.emoteId;
    const level = rec.level !== undefined ? rec.level : '?';
    return {
      time: t,
      dateOnly: false,
      icon: '🎭',
      tool: { ja: 'エモート所持率管理', en: 'Emote Collection Tracker' },
      text: {
        ja: `「${nameJa}」Lv.${level} を入手`,
        en: `Unlocked "${nameEn}" Lv.${level}`,
      },
    };
  }).filter(Boolean);
}

// ── データ源 2: ノマキャン計算機の獲得履歴（増減の記録） ──
function journalReadNomacanHistory() {
  const list = journalSafeParse(localStorage.getItem(nsKey('skyNomacanCalc_history_v1')));
  if (!Array.isArray(list)) return [];
  return list.map(e => {
    if (!e || typeof e.time !== 'number') return null;
    const label = JOURNAL_NOMACAN_LABELS[e.labelKey] || { ja: '記録', en: 'Recorded' };
    const amount = typeof e.amount === 'number' ? e.amount : 0;
    const sign = amount >= 0 ? '+' : '−';
    const n = Math.abs(amount);
    return {
      time: e.time,
      dateOnly: false,
      icon: '🕯️',
      tool: { ja: 'ノマキャン計算機', en: 'Candle Calculator' },
      text: {
        ja: `${label.ja}（${sign}${n}）`,
        en: `${label.en} (${sign}${n})`,
      },
    };
  }).filter(Boolean);
}

// ── データ源 3: ノマキャン計算機のデイリークエスト自由記述ログ ──
function journalReadNomacanQuestLog() {
  const list = journalSafeParse(localStorage.getItem(nsKey('dailyQuestLog_v1')));
  if (!Array.isArray(list)) return [];
  return list.map(e => {
    if (!e || !e.text) return null;
    const t = typeof e.time === 'number' ? e.time : (e.date ? journalDateOnlyToTime(e.date) : null);
    if (t === null || isNaN(t)) return null;
    return {
      time: t,
      dateOnly: false,
      icon: '📜',
      tool: { ja: 'ノマキャン計算機（デイリークエスト）', en: 'Candle Calculator (Daily Quest)' },
      text: {
        ja: e.text,
        en: e.text,
      },
    };
  }).filter(Boolean);
}

// ── データ源 4: 星のキャンドル計算機の獲得履歴 ──
function journalFormatDayKey(dayKey) {
  if (!dayKey) return '';
  const p = String(dayKey).split('-');
  if (p.length !== 3) return dayKey;
  const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  if (isNaN(d.getTime())) return dayKey;
  return `${d.getMonth() + 1}/${d.getDate()}`;
}
function journalReadStarCandleHistory() {
  const list = journalSafeParse(localStorage.getItem(nsKey('skyStarCandleCalc_history_v1')));
  if (!Array.isArray(list)) return [];
  return list.map(e => {
    if (!e || typeof e.time !== 'number') return null;
    const amount = typeof e.amount === 'number' ? e.amount : 0;
    const sign = amount >= 0 ? '+' : '−';
    const n = Math.abs(amount);
    let textJa, textEn;
    if (e.source === 'shard') {
      const dayLabel = journalFormatDayKey(e.dayKey);
      textJa = `赤闇${dayLabel ? `（${dayLabel}）` : ''}（${sign}${n}）`;
      textEn = `Red Shard${dayLabel ? ` (${dayLabel})` : ''} (${sign}${n})`;
    } else {
      textJa = `羽を追加（${sign}${n}）`;
      textEn = `Added feathers (${sign}${n})`;
    }
    return {
      time: e.time,
      dateOnly: false,
      icon: '🕯️✨',
      tool: { ja: '星のキャンドル計算機', en: 'Star Candle Calculator' },
      text: { ja: textJa, en: textEn },
    };
  }).filter(Boolean);
}

// ── データ源 5: 精霊同行ツールの連れ歩き記録（walkLog） ──
// 保存キーはprofiles.js既存のpfCompanionDataKey()と完全に同じ命名規則
// （companion/index.html の dataKeyForRecord() 参照）。精霊名はwalkLogの
// spiritIdだけでは分からないため、同じキーに保存されているspirits配列から引く。
// companion自身のSPIRIT_NAME_EN（companion/index.html）と同じ対応表。既定の4体の
// 「思い出」名だけが対象で、companionは名前をユーザーが自由に改名できるため、
// この表に無い名前（＝改名済み）はcompanion自身のspiritName()と同じくJA原文の
// ままフォールバック表示する（英訳が存在しないカスタム名を誤訳しないため）。
const JOURNAL_COMPANION_SPIRIT_NAME_EN = {
  'オランダの思い出': 'Dutch Memory',
  '素朴な思い出': 'Rustic Memory',
  '芸術の思い出': 'Artistic Memory',
  '喜びの思い出': 'Joyful Memory',
};
function journalReadCompanionWalkLog() {
  let raw;
  try { raw = localStorage.getItem(pfCompanionDataKey()); } catch (e) { raw = null; }
  if (raw === null) return [];
  const data = journalSafeParse(raw);
  if (!data || typeof data !== 'object') return [];
  const spirits = Array.isArray(data.spirits) ? data.spirits : [];
  const walkLog = Array.isArray(data.walkLog) ? data.walkLog : [];
  return walkLog.map(e => {
    if (!e || !e.date) return null;
    const t = journalDateOnlyToTime(e.date);
    if (t === null) return null;
    const sp = spirits.find(s => s && s.id === e.spiritId);
    const nameJa = (sp && sp.name) ? sp.name : (e.spiritId || '?');
    const nameEn = JOURNAL_COMPANION_SPIRIT_NAME_EN[nameJa] || nameJa;
    return {
      time: t,
      dateOnly: true, // companionは日付単位でしか記録しないため、時刻は表示しない
      icon: '✨',
      tool: { ja: '精霊同行ツール', en: 'Spirit Companion Tool' },
      text: { ja: `「${nameJa}」と連れ歩き`, en: `Walked with "${nameEn}"` },
    };
  }).filter(Boolean);
}

// ── エモートの表示名解決：profiles.js横断検索と同じsrchExtractArray()を再利用し、
// tai-emote/index.htmlのEMOTES_DATAを取得する。まだ公開されていない/オフライン等で
// 取得に失敗した場合はconsole.warnだけ残し、呼び出し側はIDそのまま表示にフォールバックする
async function journalBuildEmoteNameMap() {
  const map = {};
  try {
    const res = await fetch(`${SITE_ROOT}/tai-emote/index.html`, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const html = await res.text();
    const data = srchExtractArray(html, 'EMOTES_DATA') || [];
    data.forEach(em => { if (em && em.id) map[em.id] = { name: em.name, nameEn: em.nameEn }; });
  } catch (e) {
    console.warn('activity_journal: エモート表示名の解決に失敗しました（IDをそのまま表示します）', e);
  }
  return map;
}

function journalDateKeyLocal(d) {
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function journalFormatDateHeader(d) {
  if (CURRENT_LANG === 'en') {
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', weekday: 'short' });
  }
  const wd = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}（${wd}）`;
}
function journalFormatTime(d) {
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function journalRowHtml(e) {
  const toolLabel = pfT(e.tool.ja, e.tool.en);
  const desc = pfT(e.text.ja, e.text.en);
  const timeStr = e.dateOnly ? '' : journalFormatTime(new Date(e.time));
  const metaParts = [escapeHtml(toolLabel)];
  if (timeStr) metaParts.push(timeStr);
  return `<div class="journal-row">
    <div class="journal-icon">${e.icon}</div>
    <div class="journal-info">
      <div class="journal-desc">${escapeHtml(desc)}</div>
      <div class="journal-meta">${metaParts.join(' ・ ')}</div>
    </div>
  </div>`;
}

const JOURNAL_LEGEND = [
  { icon: '🎭', ja: 'エモート所持率管理', en: 'Emote Collection Tracker' },
  { icon: '🕯️', ja: 'ノマキャン計算機', en: 'Candle Calculator' },
  { icon: '🕯️✨', ja: '星のキャンドル計算機', en: 'Star Candle Calculator' },
  { icon: '✨', ja: '精霊同行ツール', en: 'Spirit Companion Tool' },
];
function journalRenderLegend() {
  const el = document.getElementById('journalLegend');
  if (!el) return;
  el.innerHTML = JOURNAL_LEGEND.map(s =>
    `<span class="journal-legend-chip">${s.icon} ${escapeHtml(pfT(s.ja, s.en))}</span>`
  ).join('');
}

let journalEmoteNameMap = {};
async function journalLoad() {
  const body = document.getElementById('journalBody');
  body.innerHTML = `<div class="empty-msg">${pfT('読み込み中…', 'Loading…')}</div>`;
  journalEmoteNameMap = await journalBuildEmoteNameMap();
  journalRender();
}

function journalRender() {
  const entries = [
    ...journalReadEmoteLog(journalEmoteNameMap),
    ...journalReadNomacanHistory(),
    ...journalReadNomacanQuestLog(),
    ...journalReadStarCandleHistory(),
    ...journalReadCompanionWalkLog(),
  ];
  entries.sort((a, b) => b.time - a.time);

  const body = document.getElementById('journalBody');
  if (!entries.length) {
    body.innerHTML = `<div class="empty-msg">${pfT(
      'まだ記録がありません。他のSkyツール（エモート所持率管理・ノマキャン計算機・星のキャンドル計算機・精霊同行ツール）を使うと、ここに自動でまとまって表示されます。',
      'No activity yet. Once you use the other Sky tools (Emote Tracker, Candle Calculator, Star Candle Calculator, Spirit Companion Tool), their records will automatically show up here.'
    )}</div>`;
    return;
  }

  let html = '';
  let lastDateKey = null;
  entries.forEach(e => {
    const d = new Date(e.time);
    const dateKey = journalDateKeyLocal(d);
    if (dateKey !== lastDateKey) {
      html += `<div class="journal-date-label">${escapeHtml(journalFormatDateHeader(d))}</div>`;
      lastDateKey = dateKey;
    }
    html += journalRowHtml(e);
  });
  body.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', () => {
  journalRenderLegend();
  journalLoad();
});
</script>
